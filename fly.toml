# fly.toml — Amazon Air Duct Cleaning (Next.js + Payload)
# Deploy: fly launch / fly deploy
# Create DB: fly postgres create && fly postgres attach <db-name>

app = 'amazadc-next'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  NEXT_PUBLIC_SERVER_URL = 'https://amazonadc.com'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
