# fly.toml — Amazon Air Duct Cleaning (Next.js + Payload)
# Deploy: fly launch / fly deploy
# Create DB: fly postgres create && fly postgres attach <db-name>

app = 'amaz-local'
primary_region = 'fra'

[build]
  [build.args]
    NEXT_PUBLIC_SERVER_URL = 'https://amaz-local.fly.dev'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  NEXT_PUBLIC_SERVER_URL = 'https://amaz-local.fly.dev'
  PAYLOAD_DB_PUSH = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
